[package]
name = "host"
description = "What kernels need from the host: standard streams, clocks, randomness, memory, certificate trust, Cloud Run's ID tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Only for Cloud Run's ID tokens (cloud_run.rs): the metadata server, and a middleware for others' agents.
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webpki.workspace = true
pki-types.workspace = true

# Linux's checks are tested on every host, against test roots.
[dev-dependencies]
webpki.workspace = true
pki-types.workspace = true
