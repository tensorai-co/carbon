[package]
name = "carbon"
description = "Carbon as a library: run Linux and Windows programs in machines of their own, and see and decide what they do as they do it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/tensorai-co/carbon"
readme = "README.md"
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
exec.workspace = true
layers.workspace = true
images.workspace = true
host.workspace = true
display.workspace = true
audio.workspace = true
net.workspace = true
gpu-api.workspace = true
lambda.workspace = true
atlas.workspace = true
hooks.workspace = true
registries-core.workspace = true
registries-apt = { workspace = true, optional = true }
registries-npm = { workspace = true, optional = true }
serde_json.workspace = true

[features]
default = ["apt", "npm"]
# Each registry a machine can be given with --registries.
apt = ["dep:registries-apt"]
npm = ["dep:registries-npm"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
display-macos.workspace = true
audio-macos.workspace = true

[dev-dependencies]
flate2.workspace = true
